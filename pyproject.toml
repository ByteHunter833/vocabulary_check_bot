[project]
name = "telegram-vocabulary-check-bot"
version = "0.1.0"
description = "Telegram-first vocabulary assessment MVP for teachers and students"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.10,<4.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "fastapi>=0.111,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.9,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "structlog>=24.1,<25.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
ocr = [
    "pillow>=10.0,<11.0",
    "pytesseract>=0.3,<1.0",
]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.5,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
